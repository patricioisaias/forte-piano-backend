# Configuracion exclusiva para pruebas: base H2 en memoria, sin depender de MySQL.
spring.datasource.url=jdbc:h2:mem:fortepiano;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# El starter security-test de Fase 0 activa la seguridad automatica en el contexto
# de prueba. La excluimos aqui (archivo nuevo de Daniel) sin tocar el pom de Patricio.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
